# Render Blueprint for Capacity Connect backend (Flask API)
# Deploy: push this file to GitHub, then in Render → New → Blueprint → select this repo.
services:
  - type: web
    name: capacity-connect-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # Seed only on first deploy; seed.py drops all tables so do NOT run it on every deploy
    # after real users exist. For a fresh demo, run `python seed.py` once via Render Shell.
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://capacity-connect-ashy.vercel.app
